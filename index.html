<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="" />
    <meta name="description" content="ATLAS: tu asistente de entrenamiento." />
    <title>ATLAS — Tu asistente de entrenamiento</title>
    <script>
      (() => {
        let preference = "system";
        try {
          preference = localStorage.getItem("atlas-theme-preference-v1") || preference;
        } catch (error) {
          console.warn("No se pudo recuperar la preferencia de tema.", error);
        }
        const validPreference = ["system", "light", "dark"].includes(preference) ? preference : "system";
        const systemPrefersDark = window.matchMedia?.("(prefers-color-scheme: dark)").matches || false;
        document.documentElement.dataset.theme = validPreference === "system"
          ? (systemPrefersDark ? "dark" : "light")
          : validPreference;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/styles.css?v=20261030-ruler-interaction-7" />
  </head>
  <body>
    <main id="app" class="app-shell" aria-live="polite"></main>
    <script type="module" src="./js/main.js?v=20261030-ruler-interaction-7"></script>
  </body>
</html>
